site_name: AI Engineering Notes

theme:
  name: material
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/compact-readability.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Learning Progress: progress/learning-progress.md
  - ML Basics:
      - Overview: ml/basics.md
      - Linear Regression: ml/linear-regression.md
  - System Design: system-design/ai-systems.md
  - Notebooks: notebooks/index.md
  - Projects: projects/index.md
  - Setup:
      - Serve docs locally: setup/serve-docs-locally.md
      - Mermaid diagrams: setup/mermaid-diagrams.md
      - Git SSH authentication: setup/git-ssh-authentication.md
      - OpenClaw Installation in VM: setup/opencalaw-installation-in-vm.md
